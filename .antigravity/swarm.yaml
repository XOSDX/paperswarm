name: PaperSwarm-MultiAgent-Build
version: "2.0"
model: gemini-2.5-pro
swarm:
  parallel_agents:
    - id: backend_agent
      role: "FastAPI & ArXiv Extraction Engine"
      target_dir: "./backend"
    - id: frontend_agent
      role: "Interactive Research Playground UI"
      target_dir: "./frontend"
    - id: test_agent
      role: "Pytest Automated Edge-Case Suite"
      target_dir: "./tests"
  verifier_agent:
    role: "Build & Regression Verifier"
    command: "pytest tests/ -v"
    auto_heal: true
